[package]
name = "herdr-hunks"
version = "0.0.1"
description = "Read-only git hunk viewer plugin for herdr, ported from vimeflow."
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/winoooops/herdr-hunks"
readme = "README.md"
keywords = ["herdr", "git", "diff", "tui", "plugin"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "herdr_hunks"
path = "src/lib.rs"

[[bin]]
name = "herdr-hunks"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm", "dep:unicode-width"]
# Unused. Kept so src/runtime/event_sink.rs stays byte-identical to vimeflow's.
e2e-test = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1", features = ["sync", "io-util", "io-std", "time", "rt", "rt-multi-thread", "macros", "process"] }
notify = "6"
ignore = "0.4"
sha2 = "0.10"
libc = "0.2"
dirs = "6"
thiserror = "2.0"
toml = "0.8"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"], optional = true }
crossterm = { version = "0.29", optional = true }
unicode-width = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
ts-rs = "10"
