name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: git --version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -- --test-threads=1
      - run: cargo check --no-default-features

  port-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the frozen vimeflow pin
        id: vimeflow
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: winoooops/vimeflow
          ref: 91e45b1c8f381385093813d0b4eb1d9daeb2d563
          path: _vimeflow
          token: ${{ secrets.VIMEFLOW_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Check the frozen port and its self-tests
        if: steps.vimeflow.outcome == 'success'
        run: |
          scripts/port-check.sh _vimeflow
          sh scripts/port-check-selftest.sh _vimeflow
      - name: Explain unavailable port checks
        if: steps.vimeflow.outcome != 'success'
        run: echo "::notice::Skipping port checks because the pinned vimeflow checkout is unavailable. For a private repository, configure VIMEFLOW_READ_TOKEN with read access; both scripts can also run locally (see README)."
